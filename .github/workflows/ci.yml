name: Node.js CI

on:
  pull_request:
    branches: [ main ]

jobs:
  # ── Unit + integration tests (Jest) ──────────────────────────────────────────
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Jest tests
        run: bun run test

